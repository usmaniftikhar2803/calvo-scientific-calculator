<style>
  :root{
    --bg-void:#0d0d0f;
    --panel:#17171a;
    --panel-border:#2a2a30;
    --text:#e8e5db;
    --text-dim:#9c968a;
    --brand-orange:#ff8a1f;
    --brand-orange-deep:#d9650c;
    --key-bg:#1e1e22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(255,138,31,0.08), transparent 60%),
      var(--bg-void);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    text-align:center;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text);
    font-weight:700;
    letter-spacing:0.06em;
    text-decoration:none;
    font-size:14px;
    font-family:'Space Mono', monospace;
    margin-bottom:40px;
  }
  .brand-dot{
    width:9px;height:9px;border-radius:2px;
    background:var(--brand-orange);
    box-shadow:0 0 8px rgba(255,138,31,0.7);
  }

  .calc-icon{
    width:96px;height:96px;
    background:linear-gradient(160deg, var(--brand-orange), var(--brand-orange-deep));
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
    box-shadow:0 10px 40px rgba(255,138,31,0.25);
  }
  .calc-icon span{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:30px;
    color:#0d0d0f;
  }

  .error-code{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:72px;
    letter-spacing:0.02em;
    margin:0 0 8px;
    background:linear-gradient(160deg, #fff, var(--text-dim));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .error-title{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:19px;
    margin:0 0 12px;
  }
  .error-desc{
    font-size:13.5px;
    line-height:1.85;
    color:var(--text-dim);
    max-width:420px;
    margin:0 0 32px;
  }
  .error-desc b{ color:var(--text); }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-bottom:36px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    padding:12px 22px;
    border-radius:10px;
    transition:transform .15s, opacity .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:linear-gradient(160deg, var(--brand-orange), var(--brand-orange-deep));
    color:#0d0d0f;
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-secondary{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
  }
  .btn-secondary:hover{ border-color:var(--brand-orange); }

  .quick-links{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    justify-content:center;
    font-size:12px;
  }
  .quick-links a{
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px dotted transparent;
  }
  .quick-links a:hover{ color:var(--brand-orange); border-bottom-color:var(--brand-orange); }
